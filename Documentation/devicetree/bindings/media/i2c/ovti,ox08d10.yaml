%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ox08d10.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OX08D10 image sensor

maintainers:
  - BeagleY-AI Project <fyx@localhost>

description: |
  Direct CSI-2 OX08D10 module using the TI four-lane HDR4 PWL12 profile.
  The module supplies its internal rails. clock-frequency describes an
  on-module oscillator when no controllable clock provider is connected.

properties:
  compatible:
    const: ovti,ox08d10
  reg:
    maxItems: 1
  clocks:
    maxItems: 1
  clock-names:
    items:
      - const: xvclk
  clock-frequency:
    const: 25000000
  enable-gpios:
    maxItems: 1
    description: Module enable, asserted to make the sensor accessible.
  reset-gpios:
    maxItems: 1
    description: Sensor reset, asserted during powerdown.
  pinctrl-names: true
  pinctrl-0: true
  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4
          link-frequencies:
            items:
              - const: 550000000
        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - port

anyOf:
  - required: [clocks]
  - required: [clock-frequency]

additionalProperties: false
