%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/maxim,max96716a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX96716A GMSL2 to CSI-2 Deserializer

maintainers:
  - BeagleY-AI Edge AI project

description: |
  The MAX96716A converts GMSL2 serial input to MIPI CSI-2. This binding
  describes the fixed single-link implementation that exposes one GMSL input
  and one CSI-2 output to V4L2.

properties:
  compatible:
    const: maxim,max96716a

  reg:
    maxItems: 1

  powerdown-gpios:
    maxItems: 1
    description: GPIO connected to the PWDNB pin.

  port0-poc-supply:
    description: Regulator providing Power over Coax for GMSL input 0.

  i2c-gate:
    $ref: /schemas/i2c/i2c-gate.yaml
    unevaluatedProperties: false
    description:
      Downstream I2C bus forwarded over the GMSL reverse channel. The
      MAX96717 serializer and its downstream sensor are described here.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: GMSL2 input

      port@1:
        $ref: /schemas/graph.yaml#/$defs/port-base
        unevaluatedProperties: false
        description: CSI-2 output

        properties:
          endpoint:
            $ref: /schemas/media/video-interfaces.yaml#
            unevaluatedProperties: false

            properties:
              data-lanes:
                minItems: 4
                maxItems: 4

              lane-polarities:
                minItems: 2
                maxItems: 5

              link-frequencies:
                maxItems: 1

            required:
              - data-lanes
              - link-frequencies

    required:
      - port@0
      - port@1

required:
  - compatible
  - reg
  - ports

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        deserializer@28 {
            compatible = "maxim,max96716a";
            reg = <0x28>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;
                    endpoint {};
                };

                port@1 {
                    reg = <1>;
                    endpoint {
                        data-lanes = <1 2 3 4>;
                        link-frequencies = /bits/ 64 <600000000>;
                    };
                };
            };
        };
    };
...
